    <!-- Haste central -->
    <path d="M256 60 C256 50, 256 400, 256 420" stroke="#fde68a" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Grão do Topo -->
    <path d="M256 48 C240 85 240 120 256 145 C272 120 272 85 256 48 Z"/>
    
    <!-- Pares de Grãos -->
    <!-- Par 1 -->
    <path d="M252 130 C205 110 160 140 140 185 C185 190 230 165 252 130 Z"/>
    <path d="M260 130 C307 110 352 140 372 185 C327 190 282 165 260 130 Z"/>
    
    <!-- Par 2 -->
    <path d="M252 205 C195 185 150 215 130 260 C175 265 220 240 252 205 Z"/>
    <path d="M260 205 C317 185 362 215 382 260 C337 265 292 240 260 205 Z"/>
    
    <!-- Par 3 -->
    <path d="M252 280 C200 260 160 290 140 335 C185 340 225 315 252 280 Z"/>
    <path d="M260 280 C312 260 352 290 372 335 C327 340 287 315 260 280 Z"/>
  </g>
  
  <!-- Texto WM em Branco/Dourado -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" fill="#ffffff" text-anchor="middle" letter-spacing="4">WM</text>
</svg>
